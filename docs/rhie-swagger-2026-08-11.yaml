components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication with username and password

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource ID (UUID)

  responses:
    Unauthorized:
      description: Authentication required or failed
    BadRequest:
      description: Invalid request data
    NotFound:
      description: Resource not found

  schemas:
    Bundle:
      type: object
      properties:
        resourceType:
          type: string
          enum: [Bundle]
        type:
          type: string
          enum: [searchset, document, transaction, collection]
        total:
          type: integer
        entry:
          type: array
          items:
            type: object
    
    Citizen:
      type: object
      required:
        - documentType
        - documentNumber
        - fosaid
      properties:
        documentType:
          type: string
          enum: [NID, NIDA, NID_APPLICATION_NUMBER, APPLICATION_NUMBER, NIN, OTHERS, PASSPORT, UPI, TEMPID, FOREIGNER_ID, RESOLVE_UPI]
        documentNumber:
          type: string
          description: Must be a valid document number based on the selected type
        fosaid:
          type: string
          description: Must be 4 digits facility code
          pattern: '^\d{4}'
        
    CitizenData:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          description: response status information
        data:
          type: object
          description: Citizen Information
          properties:
            documentType:
              type: string
            documentNumber:
              type: string
            issueNumber:
              type: string
            dateOfIssue:
              type: date
            dateOfExpiry:
              type: date
            placeOfIssue:
              type: string
            applicationNumber:
              type: string
            nin:
              type: string
            upi:
              type: string
            nid:
              type: string
            passportNumber:
              type: string
            surName:
              type: string
            postNames:
              type: string
            fatherName:
              type: string
            motherName:
              type: string
            sex:
              type: string
            dateOfBirth:
              type: date
            placeOfBirth:
              type: string
            countryOfBirth:
              type: string
            birthCountry:
              type: string
            villageId:
              type: string
            domicileCountry:
              type: string
            domicileDistrict:
              type: string
            domicileProvince:
              type: string
            domicileSector:
              type: string
            domicileCell:
              type: string
            domicileVillage:
              type: string
            civilStatus:
              type: string
            maritalStatus:
              type: string
            spouse:
              type: string
            photo:
              type: string
            citizenStatus:
              type: string
            nationality:
              type: string
            applicantType:
              type: string
            fosaid:
              type: string
            nidaServiceAvailable:
              type: boolean

    Patient:
      type: object
      required:
        - resourceType
        - id
        - identifier
        - name
        - gender
        - birthDate
      properties:
        resourceType:
          type: string
          enum: [Patient]
        id:
          type: string
          description: Must equal UPID identifier
          pattern: '^\d{6}-\d{4}-\d{4}'
        identifier:
          type: array
          items:
            type: object
            properties:
              system:
                type: string
                enum: [NID, UPI, NIN, NID_APPLICATION_NUMBER, PASSPORT]
              value:
                type: string
        active:
          type: boolean
          default: true
        name:
          type: array
          items:
            type: object
            required: [family, given]
            properties:
              family:
                type: string
              given:
                type: array
                items:
                  type: string
        gender:
          type: string
          enum: [male, female, other, unknown]
        birthDate:
          type: string
          format: date
          description: Cannot be in the future
        deceasedBoolean:
          type: boolean
        telecom:
          type: array
          items:
            type: object
            properties:
              system:
                type: string
                enum: [phone, email]
              value:
                type: string
              use:
                type: string
                enum: [mobile, home, work]
        address:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [physical, postal]
              country:
                type: string
              state:
                type: string
              district:
                type: string
              line:
                type: string
              city:
                type: string
              postalCode:
                type: string
        maritalStatus:
          type: object
          properties:
            coding:
              type: array
              items:
                type: object
                properties:
                  system:
                    type: string
                  code:
                    type: string
                    enum: [S, M, D, W, A]
                  display:
                    type: string
        extension:
          type: array
          items:
            type: object

    Consent:
      type: object
      required:
        - resourceType
        - status
        - scope
        - category
        - patient
        - dateTime
      properties:
        resourceType:
          type: string
          enum: [Consent]
        status:
          type: string
          enum: [draft, proposed, active, rejected, inactive, entered-in-error]
        scope:
          type: object
          properties:
            coding:
              type: array
              items:
                type: object
                properties:
                  system:
                    type: string
                  code:
                    type: string
                    enum: [patient-privacy, treatment, research]
                  display:
                    type: string
        category:
          type: array
          items:
            type: object
        patient:
          type: object
          required: [reference]
          properties:
            reference:
              type: string
              pattern: '^Patient/.+'
        dateTime:
          type: string
          format: date-time

    EncounterVisit:
      type: object
      required:
        - resourceType
        - status
        - class
        - type
        - subject
        - participant
        - period
        - location
      properties:
        resourceType:
          type: string
          enum: [Encounter]
        id:
          type: string
          format: uuid
        meta:
          type: object
          properties:
            tag:
              type: array
              items:
                type: object
        status:
          type: string
          enum: [planned, arrived, triaged, in-progress, onleave, finished, cancelled]
        class:
          type: object
          properties:
            system:
              type: string
            code:
              type: string
              enum: [AMB, EMER, FLD, HH, IMP, ACUTE, NONAC, OBSENC, PRENC, SS, VR]
            display:
              type: string
        type:
          type: array
          items:
            type: object
            properties:
              coding:
                type: array
                items:
                  type: object
                  properties:
                    display:
                      type: string
                      enum: [VISIT_ENCOUNTER]
        serviceType:
          type: object
        subject:
          type: object
          required: [reference]
          description: Patient reference - MANDATORY
          properties:
            reference:
              type: string
              pattern: '^Patient/.+'
            type:
              type: string
            identifier:
              type: object
            display:
              type: string
        participant:
          type: array
          description: Practitioner reference - MANDATORY
          items:
            type: object
            properties:
              individual:
                type: object
                properties:
                  reference:
                    type: string
                    pattern: '^Practitioner/.+'
                  display:
                    type: string
        period:
          type: object
          required: [start]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        location:
          type: array
          description: Location reference - MANDATORY
          items:
            type: object
            properties:
              location:
                type: object
                properties:
                  reference:
                    type: string
                    pattern: '^Location/.+'
                  display:
                    type: string

    EncounterConsultation:
      allOf:
        - $ref: '#/components/schemas/EncounterVisit'
        - type: object
          required:
            - partOf
          properties:
            type:
              type: array
              items:
                type: object
                properties:
                  coding:
                    type: array
                    items:
                      type: object
                      properties:
                        display:
                          type: string
                          enum: [CONSULTATION_ENCOUNTER]
            partOf:
              type: object
              description: Reference to parent VISIT_ENCOUNTER
              properties:
                reference:
                  type: string
                  pattern: '^Encounter/.+'

    EncounterTransfer:
      allOf:
        - $ref: '#/components/schemas/EncounterVisit'
        - type: object
          required:
            - hospitalization
            - partOf
          properties:
            type:
              type: array
              items:
                type: object
                properties:
                  coding:
                    type: array
                    items:
                      type: object
                      properties:
                        display:
                          type: string
                          enum: [TRANSFER_ENCOUNTER]
            hospitalization:
              type: object
              required: [origin, destination]
              properties:
                origin:
                  type: object
                  description: Source location - REQUIRED
                  properties:
                    reference:
                      type: string
                      pattern: '^Location/.+'
                    identifier:
                      type: object
                    display:
                      type: string
                destination:
                  type: object
                  description: Target location - REQUIRED
                  properties:
                    reference:
                      type: string
                      pattern: '^Location/.+'
                    identifier:
                      type: object
                    display:
                      type: string
            partOf:
              type: object
              description: Reference to parent VISIT_ENCOUNTER
              properties:
                reference:
                  type: string
                  pattern: '^Encounter/.+'

    ObservationVitalSigns:
      type: object
      required:
        - resourceType
        - status
        - category
        - code
        - subject
        - encounter
        - performer
        - effectiveDateTime
      properties:
        resourceType:
          type: string
          enum: [Observation]
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [registered, preliminary, final, amended, corrected, cancelled, entered-in-error, unknown]
        category:
          type: array
          items:
            type: object
            properties:
              coding:
                type: array
                items:
                  type: object
                  properties:
                    system:
                      type: string
                    code:
                      type: string
                      enum: [vital-signs]
                    display:
                      type: string
        code:
          type: object
          description: LOINC code for vital sign
          properties:
            coding:
              type: array
              items:
                type: object
                properties:
