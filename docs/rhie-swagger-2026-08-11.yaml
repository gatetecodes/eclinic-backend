openapi: 3.0.3
info:
  title: RHIE FHIR Server API
  description: |
    Rwanda Health Information Exchange (RHIE) FHIR Server API
    
    Based on HAPI FHIR Server v4.1.0 implementing FHIR v4.0.0
    
    **Base URL:** http://197.243.24.138:5001
    
    ## Global Validations
    - All resources must have a unique identifier (UUID)
    - All references (subject, encounter, practitioner) must resolve correctly
    - All dates/times must be in ISO 8601 format and logically consistent
    - Coding must be from valid terminology systems or known local systems
    - If patient has deceased status, no medical encounters should be saved after deceased date
    
    ## Authentication
    All endpoints require HTTP Basic Authentication
  version: 1.0.0
  contact:
    name: RHIE Support
servers:
  - url: http://197.243.24.138:5001/api/v1/citizens
    description: RHIE NIDA Data Access
  - url: http://197.243.24.138:5001/clientregistry
    description: RHIE Client Registry API
  - url: http://197.243.24.138:5001/shr
    description: RHIE SHR API

security:
  - basicAuth: []

tags:
  - name: Citizen
    description: Get Citizen info from NIDA
  - name: Patient
    description: Patient resource management
  - name: Consent
    description: Patient consent and advance directives
  - name: Encounter (Visit)
    description: Visit encounter management
  - name: Encounter (Consultation)
    description: Consultation encounter management
  - name: Observation (Vital Signs)
    description: Vital signs observations
  - name: Observation (Consultation)
    description: Consultation observations (chief complaints, etc.)
  - name: AllergyIntolerance
    description: Patient allergy and intolerance management
  - name: Immunization
    description: Patient immunization records
  - name: ServiceRequest (Lab Order)
    description: Laboratory test orders
  - name: Observation (Lab Results)
    description: Laboratory test results
  - name: ServiceRequest (Imaging)
    description: Imaging study orders
  - name: ImagingStudy
    description: Imaging study results
  - name: Condition
    description: Patient diagnosis and conditions
  - name: Procedure
    description: Medical procedures performed
  - name: MedicationRequest
    description: Medication prescriptions
  - name: MedicationDispense
    description: Medication dispense records
  - name: MedicationAdministration
    description: Medication administration records
  - name: Encounter (Transfer)
    description: Patient transfer encounters

paths:
  # ========== CITIZEN ==========
  /getCitizen:
    post:
      tags:
        - Citizen
      summary: Search for patient UPID
      description: |
        request patient UPID
        
        **Validations:**
        - documentType must be one of [NID, NIDA, NID_APPLICATION_NUMBER, APPLICATION_NUMBER, NIN, OTHERS, PASSPORT, UPI, TEMPID, FOREIGNER_ID, RESOLVE_UPI]
        - documentNumber to be provided as identifier
        - fosaid 4 digits facility code identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Citizen'
      responses:
        '201':
          description: Citizen Data Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      parameters:
        - name: identifier
          in: query
          schema:
            type: string
          description: Patient identifier (UPID, NID, etc.)
        - name: given
          in: query
          schema:
            type: string
          description: Given name
        - name: family
          in: query
          schema:
            type: string
          description: Family name
        - name: birthdate
          in: query
          schema:
            type: string
            format: date
          description: Birth date (YYYY-MM-DD)
      responses:
        '200':
          description: Successful search
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========== PATIENT ==========
  /Patient:
    get:
      tags:
        - Patient
      summary: Search for patients
      description: |
        Search for patients by various criteria
        
        **Validations:**
        - UPID format must be valid
        - If NID provided, must validate against DOB
        - Birthdate cannot be in the future
      parameters:
        - name: identifier
          in: query
          schema:
            type: string
          description: Patient identifier (UPID, NID, etc.)
        - name: given
          in: query
          schema:
            type: string
          description: Given name
        - name: family
          in: query
          schema:
            type: string
          description: Family name
        - name: birthdate
          in: query
          schema:
            type: string
            format: date
          description: Birth date (YYYY-MM-DD)
      responses:
        '200':
          description: Successful search
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      tags:
        - Patient
      summary: Create a new patient
      description: |
        Create a new patient record
        
        **Required Fields:**
        - identifier (UPID)
        - name
        - gender
        - birthDate
        
        **Validations:**
        - Resource identifier should equal UPID identifier
        - UPID format must be valid
        - If NID provided, must validate against DOB
        - Birthdate cannot be in the future
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Patient'
      responses:
        '201':
          description: Patient created successfully
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /Patient/{id}:
    get:
      tags:
        - Patient
      summary: Read patient by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Patient found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========== CONSENT ==========
  /Consent:
    post:
      tags:
        - Consent
      summary: Create patient consent
      description: |
        Create a consent record for patient privacy or treatment
        
        **Required Fields:**
        - status (draft | proposed | active | rejected | inactive)
        - scope (patient-privacy | treatment | research)
        - category
        - patient reference
        - dateTime
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Consent'
      responses:
        '201':
          description: Consent created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      tags:
        - Consent
      summary: Search consents
      parameters:
        - name: patient
          in: query
          required: true
          schema:
            type: string
          description: Patient reference
      responses:
        '200':
          description: Successful search
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  /Consent/{id}:
    get:
      tags:
        - Consent
      summary: Read consent by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Consent found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Consent'

    delete:
      tags:
        - Consent
      summary: Delete consent
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Consent deleted

  /Consent/$list-consents:
    get:
      tags:
        - Consent
      summary: List consents operation
      parameters:
        - name: patient
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consents list
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  # ========== ENCOUNTER (VISIT) ==========
  /Encounter:
    post:
      tags:
        - Encounter (Visit)
      summary: Create visit encounter
      description: |
        Create a visit encounter (VISIT_ENCOUNTER type)
        
        **Required Fields:**
        - status (in-progress | finished)
        - class (AMB for ambulatory)
        - type (VISIT_ENCOUNTER)
        - subject (patient reference) - MANDATORY
        - participant (practitioner reference) - MANDATORY
        - location - MANDATORY
        - period.start
        
        **Validations:**
        - Practitioner reference is mandatory
        - Location reference is mandatory
        - Encounter type is mandatory
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/EncounterVisit'
      responses:
        '201':
          description: Encounter created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/EncounterVisit'

    get:
      tags:
        - Encounter (Visit)
      summary: Search encounters
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: searchSet
          in: query
          schema:
            type: string
            enum: [ALL, UPI, LOCATION]
        - name: value
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Encounters found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  /Encounter/{id}:
    get:
      tags:
        - Encounter (Visit)
      summary: Read encounter by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Encounter found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/EncounterVisit'

    delete:
      tags:
        - Encounter (Visit)
      summary: Delete encounter
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Encounter deleted

  /Encounter/$list-encounters:
    get:
      tags:
        - Encounter (Visit)
      summary: List encounters operation
      parameters:
        - name: patient
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Encounters list
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  # ========== ENCOUNTER (CONSULTATION) ==========
  /Encounter/consultation:
    post:
      tags:
        - Encounter (Consultation)
      summary: Create consultation encounter
      description: |
        Create a consultation encounter (CONSULTATION_ENCOUNTER type)
        
        Must have partOf reference to parent VISIT_ENCOUNTER
        
        **Required Fields:** Same as Visit Encounter plus:
        - partOf (reference to parent visit encounter)
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/EncounterConsultation'
      responses:
        '201':
          description: Consultation encounter created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/EncounterConsultation'

  # ========== OBSERVATION (VITAL SIGNS) ==========
  /Observation/vital-signs:
    post:
      tags:
        - Observation (Vital Signs)
      summary: Create vital signs observation
      description: |
        Create a vital signs observation
        
        **Required Fields:**
        - status (final | preliminary)
        - category (vital-signs)
        - code (LOINC code for vital sign)
        - subject (patient reference) - MANDATORY
        - encounter reference - MANDATORY
        - performer (practitioner reference) - MANDATORY
        - value (cannot be N/A)
        - effectiveDateTime
        
        **Supported Value Types:**
        - valueQuantity
        - valueCodeableConcept
        - valueString
        - valueInteger
        - valueTime
        - valueDateTime
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/ObservationVitalSigns'
      responses:
        '201':
          description: Vital signs observation created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/ObservationVitalSigns'

  # ========== OBSERVATION (CONSULTATION) ==========
  /Observation/consultation:
    post:
      tags:
        - Observation (Consultation)
      summary: Create consultation observation
      description: |
        Create consultation observations (chief complaints, survey data, etc.)
        
        **Required Fields:**
        - status (final | preliminary)
        - category (survey | exam)
        - code
        - subject (patient reference) - MANDATORY
        - encounter reference - MANDATORY
        - performer (practitioner reference) - MANDATORY
        - value (cannot be N/A)
        - effectiveDateTime
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/ObservationConsultation'
      responses:
        '201':
          description: Consultation observation created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/ObservationConsultation'

  /Observation/{id}:
    get:
      tags:
        - Observation (Vital Signs)
      summary: Read observation by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Observation found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/ObservationVitalSigns'

    delete:
      tags:
        - Observation (Vital Signs)
      summary: Delete observation
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Observation deleted

  /Observation:
    get:
      tags:
        - Observation (Vital Signs)
      summary: Search observations
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Observations found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  /Observation/$list-observations:
    get:
      tags:
        - Observation (Vital Signs)
      summary: List observations operation
      parameters:
        - name: patient
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Observations list
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  # ========== ALLERGY INTOLERANCE ==========
  /AllergyIntolerance:
    post:
      tags:
        - AllergyIntolerance
      summary: Create allergy intolerance
      description: |
        Create an allergy or intolerance record
        
        **Required Fields:**
        - clinicalStatus (active | inactive | resolved) - REQUIRED
        - verificationStatus (unconfirmed | confirmed | refuted | entered-in-error) - REQUIRED
        - patient reference - REQUIRED
        - code (allergy identification code) - MANDATORY
        - recordedDate - MANDATORY
        - onsetDateTime (when identified) - MANDATORY
        
        **Optional Fields:**
        - encounter reference
        - asserter (who identified)
        - reaction
        - extension (location reference)
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/AllergyIntolerance'
      responses:
        '201':
          description: AllergyIntolerance created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/AllergyIntolerance'

    get:
      tags:
        - AllergyIntolerance
      summary: Search allergies
      parameters:
        - name: patient
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Allergies found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  /AllergyIntolerance/{id}:
    get:
      tags:
        - AllergyIntolerance
      summary: Read allergy by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Allergy found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/AllergyIntolerance'

    delete:
      tags:
        - AllergyIntolerance
      summary: Delete allergy
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Allergy deleted

  /AllergyIntolerance/$list-allergies:
    get:
      tags:
        - AllergyIntolerance
      summary: List allergies operation
      parameters:
        - name: patient
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Allergies list
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  # ========== IMMUNIZATION ==========
  /Immunization:
    post:
      tags:
        - Immunization
      summary: Create immunization record
      description: |
        Create an immunization record
        
        **Required Fields:**
        - status (completed | not-done) - REQUIRED
        - vaccineCode (NPC code) - REQUIRED
        - patient reference - REQUIRED
        - occurrenceDateTime (not in future) - REQUIRED
        - performer (practitioner) - REQUIRED
        - location - REQUIRED
        
        **Optional Fields:**
        - encounter reference (NOT mandatory)
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Immunization'
      responses:
        '201':
          description: Immunization created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Immunization'

    get:
      tags:
        - Immunization
      summary: Search immunizations
      parameters:
        - name: patient
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Immunizations found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  /Immunization/{id}:
    get:
      tags:
        - Immunization
      summary: Read immunization by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Immunization found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Immunization'

    delete:
      tags:
        - Immunization
      summary: Delete immunization
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Immunization deleted

  /Immunization/$list-immunizations:
    get:
      tags:
        - Immunization
      summary: List immunizations operation
      parameters:
        - name: patient
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Immunizations list
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  # ========== SERVICE REQUEST (LAB ORDER) ==========
  /ServiceRequest/lab:
    post:
      tags:
        - ServiceRequest (Lab Order)
      summary: Create lab order
      description: |
        Create a laboratory test order
        
        **Required Fields:**
        - status (active | completed)
        - intent (order)
        - category (code: 108252007 - Laboratory procedure)
        - code (SNOMED CT code)
        - subject (patient reference) - REQUIRED
        - encounter reference
        - occurrenceDateTime (not future) - MANDATORY
        - requester (practitioner) - REQUIRED
        - performer (practitioner) - REQUIRED
        - locationReference - REQUIRED
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/ServiceRequestLab'
      responses:
        '201':
          description: Lab order created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/ServiceRequestLab'

  /ServiceRequest/{id}:
    get:
      tags:
        - ServiceRequest (Lab Order)
      summary: Read service request by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Service request found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/ServiceRequestLab'

    delete:
      tags:
        - ServiceRequest (Lab Order)
      summary: Delete service request
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Service request deleted

  /ServiceRequest:
    get:
      tags:
        - ServiceRequest (Lab Order)
      summary: Search service requests
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Service requests found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  /ServiceRequest/$list-servicerequests:
    get:
      tags:
        - ServiceRequest (Lab Order)
      summary: List service requests operation
      parameters:
        - name: patient
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service requests list
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  # ========== OBSERVATION (LAB RESULTS) ==========
  /Observation/lab-results:
    post:
      tags:
        - Observation (Lab Results)
      summary: Create lab results observation
      description: |
        Create laboratory test results
        
        **Required Fields:**
        - status (final | preliminary)
        - category (laboratory)
        - code (LOINC code) - REQUIRED
        - subject (patient reference) - REQUIRED
        - encounter reference - MANDATORY
        - performer (practitioner) - REQUIRED
        - value (cannot be N/A) - MANDATORY
        - effectiveDateTime (not future) - REQUIRED
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/ObservationLabResults'
      responses:
        '201':
          description: Lab results created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/ObservationLabResults'

  # ========== SERVICE REQUEST (IMAGING) ==========
  /ServiceRequest/imaging:
    post:
      tags:
        - ServiceRequest (Imaging)
      summary: Create imaging order
      description: |
        Create an imaging study order
        
        **Required Fields:**
        - status (active | completed)
        - intent (order)
        - category (code: 363679005 - Imaging)
        - code (SNOMED CT code)
        - subject (patient reference) - REQUIRED
        - encounter reference
        - occurrenceDateTime (not future) - MANDATORY
        - requester (practitioner) - REQUIRED
        - performer (practitioner) - REQUIRED
        - locationReference - REQUIRED
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/ServiceRequestImaging'
      responses:
        '201':
          description: Imaging order created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/ServiceRequestImaging'

  # ========== IMAGING STUDY ==========
  /ImagingStudy:
    post:
      tags:
        - ImagingStudy
      summary: Create imaging study results
      description: |
        Create imaging study results
        
        **Required Fields:**
        - status (available | registered)
        - modality (DICOM modality code)
        - subject (patient reference) - REQUIRED
        - encounter reference
        - started (not future)
        - procedureCode
        - reasonCode
        - description
        - conclusion
        - conclusionCode
        - series (with instances)
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/ImagingStudy'
      responses:
        '201':
          description: Imaging study created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/ImagingStudy'

    get:
      tags:
        - ImagingStudy
      summary: Search imaging studies
      parameters:
        - name: subject
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Imaging studies found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'

  /ImagingStudy/{id}:
    get:
      tags:
        - ImagingStudy
      summary: Read imaging study by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Imaging study found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/ImagingStudy'

    delete:
      tags:
        - ImagingStudy
      summary: Delete imaging study
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Imaging study deleted

  # ========== CONDITION (DIAGNOSIS) ==========
