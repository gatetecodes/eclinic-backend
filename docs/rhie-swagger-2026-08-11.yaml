        Create a transfer encounter (TRANSFER_ENCOUNTER type)
        
        **Required Fields:**
        - status (in-progress | finished)
        - class (AMB)
        - type (TRANSFER_ENCOUNTER)
        - subject (patient reference) - MANDATORY
        - participant (practitioner reference) - MANDATORY
        - period.start
