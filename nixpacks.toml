[phases.setup]
# Install bun + openssl 3.0.x (critical for Prisma 6+ on ARM64)
nixPkgs = ["bun", "openssl_3"]

[phases.install]
cmds = ["bun install"]

[phases.generate]
cmds = ["bunx prisma generate"]
dependsOn = ["install"]

[phases.build]
cmds = ["bun run build"]
dependsOn = ["generate"]

[start]
cmd = "bunx prisma migrate deploy && bun run start"
[phases.setup]
nixPkgs = ["bun", "openssl_3"]
# Force OpenSSL 3.0 libraries into runtime path
nixLibs = ["openssl_3"]

[phases.install]
cmds = ["bun install"]

[phases.generate]
cmds = ["bunx prisma generate"]
dependsOn = ["install"]

[phases.build]
cmds = ["bun run build"]
dependsOn = ["generate"]

# Critical: Set LD_LIBRARY_PATH to include OpenSSL 3.0 libs
[environment]
LD_LIBRARY_PATH = "/nix/store/*-openssl-3.*/lib"

[start]
cmd = "bunx prisma migrate deploy && bun run start"

[phases.debug]
cmds = [
  "echo 'OpenSSL version:'",
  "openssl version",
  "echo 'libssl.so.3 location:'",
  "find /nix/store -name 'libssl.so.3' 2>/dev/null || echo 'not found'",
  "echo 'LD_LIBRARY_PATH:' $LD_LIBRARY_PATH"
]
dependsOn = ["setup"]
