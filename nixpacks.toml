[phases.setup]
nixPkgs = ["bun", "openssl_3"]
nixLibs = ["openssl_3"]

[phases.install]
cmds = ["bun install"]

# Remove/disable the separate generate phase
#[phases.generate]
#cmds = ["bunx prisma generate"]
#dependsOn = ["install"]

[phases.build]
# Generate right before build so it survives the prior COPY
cmds = [
  "bunx prisma generate",
  "bun run build"
]
dependsOn = ["install"]

[environment]
LD_LIBRARY_PATH = "/nix/store/*-openssl-3.*/lib"

[start]
cmd = "sh ./scripts/start-prod.sh"
